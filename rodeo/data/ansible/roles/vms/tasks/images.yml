---
- name: Ensure image, config, and serial log directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - "{{ image_dir }}"
    - "{{ config_dir }}"
    - "{{ serial_log_dir }}"

# --- SSH key (must exist before the Harvester config + Rancher cloud-init are
#     rendered, so its public key can be baked into both) ---

- name: Ensure host SSH key for guest access
  ansible.builtin.include_role:
    name: common
    tasks_from: ensure_ssh_key

# Nested VM IPs are static and reused across every redeploy, but each fresh
# install generates a new host key — so a stale entry from a previous deploy
# always triggers a false "REMOTE HOST IDENTIFICATION HAS CHANGED" warning
# (it's the same IP, a genuinely different VM, not a real MITM). Clear any
# cached entry for each node's IP before the new VM boots and offers its key.
- name: Clear stale known_hosts entries for reused nested-VM IPs
  ansible.builtin.known_hosts:
    name: "{{ item.ip }}"
    state: absent
  loop: "{{ vm_nodes }}"
  loop_control:
    label: "{{ item.name }}"
  when: item.ip is defined

# --- Harvester ISO ---

- name: Download Harvester {{ harvester_version }} ISO
  ansible.builtin.include_role:
    name: common
    tasks_from: curl_fetch
  vars:
    curl_fetch_url: >-
      https://releases.rancher.com/harvester/v{{ harvester_version }}/harvester-v{{ harvester_version }}-amd64.iso
    curl_fetch_dest: "{{ image_dir }}/harvester-v{{ harvester_version }}-amd64.iso"
  # Skip on Rancher-only labs (no Harvester nodes) so they stay small/fast.
  when: vm_nodes | selectattr('flavor', 'equalto', 'harvester') | list | length > 0

- name: Verify Harvester {{ harvester_version }} ISO checksum
  ansible.builtin.shell: |
    set -euo pipefail
    dest='{{ image_dir }}/harvester-v{{ harvester_version }}-amd64.iso'
    expected='{{ harvester_iso_checksum | regex_replace("^sha512:", "") }}'
    actual=$(sha512sum "$dest" | awk '{print $1}')
    [ "$actual" = "$expected" ]
  args:
    executable: /bin/bash
  changed_when: false
  when:
    - vm_nodes | selectattr('flavor', 'equalto', 'harvester') | list | length > 0
    - harvester_iso_checksum | default('') | length > 0

# --- Harvester node disks and OVMF vars (fired in parallel) ---
# qemu-img and OVMF copy are independent per node — fire all at once and
# collect results after. The disk creation (preallocation=metadata on a
# 320 GiB image) is the bottleneck; running 3 in parallel saves ~2x disk time.

- name: Create Harvester node qcow2 disk images (async)
  ansible.builtin.command: >
    qemu-img create -f qcow2 -o preallocation=metadata
    {{ image_dir }}/{{ item.name }}-vda.qcow2
    {{ libvirt_flavors[item.flavor].disk_gb }}G
  args:
    creates: "{{ image_dir }}/{{ item.name }}-vda.qcow2"
  loop: "{{ vm_nodes | selectattr('flavor', 'equalto', 'harvester') | list }}"
  loop_control:
    label: "{{ item.name }}"
  async: 3600
  poll: 0
  register: disk_jobs

- name: Copy OVMF variable store for each Harvester node (async)
  ansible.builtin.command:
    cmd: cp {{ ovmf_vars_template }} {{ image_dir }}/{{ item.name }}-ovmf-vars.fd
    creates: "{{ image_dir }}/{{ item.name }}-ovmf-vars.fd"
  loop: "{{ vm_nodes | selectattr('flavor', 'equalto', 'harvester') | list }}"
  loop_control:
    label: "{{ item.name }}"
  async: 3600
  poll: 0
  register: ovmf_jobs

# --- Harvester config seed ISOs ---
# Staging dirs and template rendering are fast sequential ops. ISOs are fired
# async immediately after templates are rendered so they overlap disk creation.

- name: Create Harvester config staging directories
  ansible.builtin.file:
    path: "{{ config_dir }}/{{ item.config_iso_name }}/harvester"
    state: directory
    mode: '0755'
  loop: "{{ vm_nodes | selectattr('flavor', 'equalto', 'harvester') | list }}"
  loop_control:
    label: "{{ item.name }}"

- name: Render Harvester node config YAML
  ansible.builtin.template:
    src: harvester-config.yaml.j2
    dest: "{{ config_dir }}/{{ item.config_iso_name }}/harvester/config.yaml"
  loop: "{{ vm_nodes | selectattr('flavor', 'equalto', 'harvester') | list }}"
  loop_control:
    label: "{{ item.name }}"

# No creates: guard — config seed ISO is always rebuilt to match current templates
# (same pattern as rancher_image.yml / eib_image.yml cloud-init ISOs).
- name: Build Harvester config seed ISOs (async)
  ansible.builtin.command: >
    xorriso -as mkisofs
    -V HarvesterConfig -J -r
    -o '{{ image_dir }}/{{ item.config_iso_name }}.iso'
    '{{ config_dir }}/{{ item.config_iso_name }}'
  loop: "{{ vm_nodes | selectattr('flavor', 'equalto', 'harvester') | list }}"
  loop_control:
    label: "{{ item.name }}"
  async: 3600
  poll: 0
  register: iso_jobs

# --- Collect async results ---
# selectattr('ansible_job_id', 'defined') skips tasks that were short-circuited
# by creates: (file already existed — no subprocess was launched).

- name: Wait for disk images
  ansible.builtin.async_status:
    jid: "{{ item.ansible_job_id }}"
  loop: "{{ disk_jobs.results | selectattr('ansible_job_id', 'defined') | list }}"
  loop_control:
    label: "{{ item.item.name }}"
  register: disk_results
  until: disk_results.finished
  retries: 120
  delay: 10

- name: Wait for OVMF copies
  ansible.builtin.async_status:
    jid: "{{ item.ansible_job_id }}"
  loop: "{{ ovmf_jobs.results | selectattr('ansible_job_id', 'defined') | list }}"
  loop_control:
    label: "{{ item.item.name }}"
  register: ovmf_results
  until: ovmf_results.finished
  retries: 60
  delay: 5

- name: Wait for config ISOs
  ansible.builtin.async_status:
    jid: "{{ item.ansible_job_id }}"
  loop: "{{ iso_jobs.results | selectattr('ansible_job_id', 'defined') | list }}"
  loop_control:
    label: "{{ item.item.name }}"
  register: iso_results
  until: iso_results.finished
  retries: 60
  delay: 5

# --- Rancher VM disk and cloud-init (only when the topology has a Rancher node) ---
# Rancher-less labs (e.g. the 2-node 'test' profile) skip this entirely.
- name: Provision the Rancher VM image + cloud-init
  ansible.builtin.include_tasks: rancher_image.yml
  when: (vm_nodes | selectattr('flavor', 'equalto', 'rancher') | list | length) > 0

# --- EIB VM (Edge Image Builder): base image + cloud-init seed ---
# Only for SUSE Edge labs that include an EIB node.
- name: Provision the EIB VM image + cloud-init
  ansible.builtin.include_tasks: eib_image.yml
  when: (vm_nodes | selectattr('flavor', 'equalto', 'eib') | list | length) > 0

# --- Edge nodes: OVMF vars only (no blank disks) ---
# Edge nodes boot from an Elemental OS RAW image built on the EIB VM (participant
# exercise). Disk images are thin-cloned from the EIB output by 'rodeo pull-edge-image'
# AFTER participants complete the EIB image build step. No disk is pre-created here;
# attempting to start an edge node before running pull-edge-image fails with a clear
# error message from 'rodeo start'.

- name: Copy OVMF variable store for each edge node (async)
  ansible.builtin.command:
    cmd: cp {{ ovmf_vars_template }} {{ image_dir }}/{{ item.name }}-ovmf-vars.fd
    creates: "{{ image_dir }}/{{ item.name }}-ovmf-vars.fd"
  loop: "{{ vm_nodes | selectattr('flavor', 'equalto', 'edge-node') | list }}"
  loop_control:
    label: "{{ item.name }}"
  async: 60
  poll: 0
  register: edge_ovmf_jobs

- name: Wait for edge node OVMF copies
  ansible.builtin.async_status:
    jid: "{{ item.ansible_job_id }}"
  loop: "{{ edge_ovmf_jobs.results | selectattr('ansible_job_id', 'defined') | list }}"
  loop_control:
    label: "{{ item.item.name }}"
  register: edge_ovmf_results
  until: edge_ovmf_results.finished
  retries: 12
  delay: 5
  when: (edge_ovmf_jobs.results | selectattr('ansible_job_id', 'defined') | list | length) > 0
