---
# EIB VM disk + cloud-init seed for SUSE Edge labs.
# The EIB VM hosts the Edge Image Builder container and Hauler artifact cache.
#
# Base OS: openSUSE Leap Micro 6.2 Default qcow (ships with cloud-init + Podman
# pre-installed; immutable root via btrfs snapshots managed by transactional-update).
# virt-customize only enables cloud-init services — no package install inside guestfs
# (guestfs has no network; packages install offline fail on Leap Micro).
# Hauler binary is installed at first boot via cloud-init runcmd.

- name: Download openSUSE Leap Micro 6.2 image for EIB VM
  ansible.builtin.shell: |
    set -euo pipefail
    dest='{{ image_dir }}/Leap-Micro-6.2.qcow2'
    tmp="$dest.downloading"
    # HTTP/1.1 + retry-all-errors + resume: download.opensuse.org intermittently
    # breaks HTTP/2 streams (curl error 92 PROTOCOL_ERROR); atomic move so a
    # partial never satisfies the `creates:` guard as a truncated image.
    curl -4 --http1.1 -fsSL --retry 5 --retry-delay 10 --retry-all-errors \
      -C - -o "$tmp" '{{ leap_micro_62_url }}'
    mv "$tmp" "$dest"
  args:
    executable: /bin/bash
    creates: "{{ image_dir }}/Leap-Micro-6.2.qcow2"

# Leap Micro 6.2 Default qcow ships with cloud-init pre-installed; only enable services.
# Podman is built-in; Hauler binary installs at first boot via cloud-init runcmd.
- name: Build EIB VM disk (Leap Micro 6.2 base + enable cloud-init services)
  ansible.builtin.shell: |
    set -euo pipefail
    tmp='{{ image_dir }}/eib-vda.qcow2.building'
    rm -f "$tmp"
    qemu-img convert -f qcow2 -O qcow2 -o preallocation=metadata \
      '{{ image_dir }}/Leap-Micro-6.2.qcow2' "$tmp"
    virt-customize -a "$tmp" \
      --run-command 'systemctl enable cloud-init-local.service cloud-init.service cloud-config.service cloud-final.service'
    mv "$tmp" '{{ image_dir }}/eib-vda.qcow2'
  args:
    executable: /bin/bash
    creates: "{{ image_dir }}/eib-vda.qcow2"
  environment:
    LIBGUESTFS_BACKEND: direct

- name: Copy OVMF variable store for EIB VM
  ansible.builtin.command:
    cmd: cp {{ ovmf_vars_template }} {{ image_dir }}/eib-ovmf-vars.fd
    creates: "{{ image_dir }}/eib-ovmf-vars.fd"

- name: Get EIB VM disk virtual size
  ansible.builtin.command: qemu-img info --output=json '{{ image_dir }}/eib-vda.qcow2'
  register: eib_disk_info
  changed_when: false
  failed_when: false

- name: Resize EIB VM disk to {{ libvirt_flavors.eib.disk_gb }}G
  ansible.builtin.command: >
    qemu-img resize '{{ image_dir }}/eib-vda.qcow2' {{ libvirt_flavors.eib.disk_gb }}G
  when:
    - eib_disk_info.rc == 0
    - (eib_disk_info.stdout | from_json)['virtual-size'] | int < (libvirt_flavors.eib.disk_gb | int * 1073741824)

- name: Create EIB cloud-init staging directory
  ansible.builtin.file:
    path: /tmp/eib-cloud-init
    state: directory
    mode: '0755'

- name: Write EIB cloud-init meta-data
  ansible.builtin.template:
    src: eib-cloud-init-meta-data.j2
    dest: /tmp/eib-cloud-init/meta-data

- name: Write EIB cloud-init user-data
  ansible.builtin.template:
    src: eib-cloud-init-user-data.j2
    dest: /tmp/eib-cloud-init/user-data

- name: Write EIB cloud-init network-config
  ansible.builtin.template:
    src: eib-cloud-init-network-config.j2
    dest: /tmp/eib-cloud-init/network-config

# No creates: guard — rebuilt every time so it always matches current templates.
- name: Build EIB cloud-init seed ISO
  ansible.builtin.command: >
    xorriso -as mkisofs
    -V cidata -J -r
    -o '{{ image_dir }}/eib-cloud-init.iso'
    /tmp/eib-cloud-init/meta-data
    /tmp/eib-cloud-init/user-data
    /tmp/eib-cloud-init/network-config
