# rodeo-plan.yaml — deployment plan for SUSE Virtualization Rodeo
# Run: rodeo init  to generate this file interactively.
# Secrets go in ~/.rodeo/secrets.yaml (chmod 600, never committed).
#
# Harvester nodes install via iPXE (pxe_server phase). NAT mode only for PXE today.

name: suse-virt-rodeo

# instruqt: finalise (VM autostart + libvirt-guests) is skipped — do not bake
# it into a hostimage (can hang boot / Instruqt "Please Wait"). Use
# `rodeo start-if-needed` on every hostimage boot instead. baremetal: finalise runs.
deployment_target: instruqt   # instruqt | baremetal

network:
  mode: nat              # nat | bridge
  vip: "192.168.122.10"   # kube-vip floating IP — must not be a node IP
  rancher_ip: "192.168.122.9"
  gateway: "192.168.122.1"
  dns_domain: "rodeo.lab"
  # bridge mode only:
  # host_bridge: br0

resources:
  harvester:
    memory_mib: 16384    # 16 GiB — meets Harvester minimum
    vcpu: 8
    disk_gb: 320         # 150 GB persistent partition is a fixed Harvester floor;
                         # 320 GB leaves Longhorn ~165 GB of real room
  rancher:
    memory_mib: 8192
    vcpu: 4
    disk_gb: 60

versions:
  harvester: "1.8.1"
  rancher: "2.14.1"
  k3s: "v1.35.3+k3s1"
  cert_manager: "v1.20.1"

storage:
  image_dir: /var/lib/libvirt/images

libvirt:
  uri: qemu:///system

ansible:
  # Path to the directory containing ansible/playbook.yml.
  # Falls back to: RODEO_ANSIBLE_PATH env var, bundled data, then ./
  path: null
  inventory: deployer/inventory.local

credentials:
  # ??placeholders are resolved at load time. Supported forms:
  #   ??key                  -> ~/.rodeo/secrets.yaml (rodeo init creates it)
  #   ??env:RODEO_PASSWORD   -> environment variable
  #   ??file:/run/secrets/pw -> file contents (mounted secrets)
  #   ??cmd:pass show rodeo  -> command stdout (pass, op, vault CLI...)
  # If a source returns nothing, deploy fails fast instead of using
  # an empty password.
  harvester_os_password: "??harvester_os_password"
  harvester_admin_password: "??harvester_admin_password"
  rancher_admin_password: "??rancher_admin_password"
  # Cluster join token — random per environment (rodeo init generates it)
  harvester_token: "??harvester_token"
