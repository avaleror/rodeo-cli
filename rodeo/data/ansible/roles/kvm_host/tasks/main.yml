---
- name: Include SELinux tasks
  ansible.builtin.import_tasks: selinux.yml

- name: Include package tasks
  ansible.builtin.import_tasks: packages.yml

- name: Include NVMe instance-store pool (aws / storage.backend=nvme)
  ansible.builtin.import_tasks: nvme_storage.yml
  when: >
    (host_storage_backend | default('') | lower) == 'nvme'
    or (deployment_target | default('') | lower) == 'aws'

- name: Include libvirt tasks
  ansible.builtin.import_tasks: libvirt.yml

- name: Include networking tasks
  ansible.builtin.import_tasks: networking.yml

- name: Include libvirt hook tasks
  ansible.builtin.import_tasks: libvirt-hook.yml

- name: Include firewall tasks
  ansible.builtin.import_tasks: firewall.yml

- name: Include NFS tasks
  ansible.builtin.import_tasks: nfs.yml

- name: Flush handlers
  ansible.builtin.meta: flush_handlers
