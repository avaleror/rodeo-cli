# What the student UI (rodeo player) shows for this lab (see rodeo/player/profile.py).
# No track: the exercises live on the workshop guide, opened from the player.
title: SUSE Edge Workshop
guide_url: https://avaleror.github.io/suse-edge-workshop/
# The guide runs virsh and rodeo pull-edge-image on the host and logs in to the
# lab VMs as root. libvirt access is root-equivalent on the host, so fleets need
# per_host_ssh_key. edge3/edge4 do not exist yet when the player is set up: a
# player fleet makes the student key before rodeo up and their images trust it.
student_libvirt: true
student_vm_access: [192.168.122.9, 192.168.122.20]
uis:
  # On EC2 fleet hosts Rancher moves to NodePort 30002 (rodeo.host_context).
  - key: rancher
    label: SUSE Rancher Prime
    upstream: 192.168.122.9:30002
    tab_port: 30002
  # Gitea on the eib VM holds eib-config and the Fleet app repo.
  - key: gitea
    label: Gitea
    upstream: 192.168.122.20:3000
    scheme: http
    tab_port: 3000
credentials:
  - label: SUSE Rancher Prime
    user: admin
    password: ??rancher_admin_password
  - label: rancher and eib VMs (console)
    user: root
    password: ??rancher_vm_password
