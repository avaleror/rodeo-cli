# rodeo-plan.yaml — full 3-node Harvester HCI + Rancher Prime, pre-tuned for
# AWS, WITH the extra pre-lab state suse-virt-workshop's exercises need
# (virt-workshop-aws profile). Same infra as harvester-aws, plus
# custom/scripts/ that: cache a VM image over HTTP, export an NFS backup
# target, and pre-create the "webserver-prod" VM — giving the self-serve
# workshop the same starting state suse-virt-rodeo's Instruqt image already
# has baked in. See custom/scripts/*.sh for what each step does and why.
#
# harvester-aws stays untouched — this is a separate profile for running the
# suse-virt-workshop exercises specifically, not a replacement.
#
# Fill in provider.region and provider.subnet_id, then: rodeo up --target aws

name: virt-workshop-aws-rodeo
deployment_target: aws

provider:
  type: aws
  region: eu-central-1          # <- set to your region
  subnet_id: subnet-CHANGE-ME   # <- must be in a VPC with an internet gateway
  instance_tier: recommended    # budget | recommended | performance — see instance_catalog.py
  # instance_type: m8id.8xlarge   # or pin explicitly instead of a tier
  associate_public_ip: true
  # security_group_ids: [sg-...] # omit to let rodeo create/manage one,
  #                               # scoped to this machine's public IP

network:
  mode: nat
  vip: "192.168.122.10"
  rancher_ip: "192.168.122.9"
  gateway: "192.168.122.1"
  dns_domain: "vertextrust.bank"   # matches the Vertex Trust Bank story, same as suse-virt-workshop

resources:
  harvester:
    memory_mib: 24576    # 24 GiB per Harvester node — same sizing as harvester-aws.
                         # 3x24 + 16 (Rancher) = 88 GiB guest RAM total, leaving
                         # ~35 GiB of m8id.8xlarge's ~123 GiB usable RAM for the
                         # host + buff/cache.
    vcpu: 10
    disk_gb: 500         # matches the AWS host-context floor: 3 nodes x 500 GB +
                         # 60 GB (Rancher) = 1560 GB, comfortable margin under
                         # m8id.8xlarge's single ~1.9 TiB NVMe device. Leaves
                         # room for the ~308 MiB cached VM image and webserver-prod's
                         # own 5 GiB disk (both created by custom/scripts/) too.
  rancher:
    memory_mib: 16384    # 16 GiB — same as harvester-aws.
    vcpu: 4
    disk_gb: 60

versions:
  harvester: "1.8.1"
  rancher: "2.14.1"
  k3s: "v1.35.3+k3s1"
  cert_manager: "v1.20.1"

storage:
  image_dir: /var/lib/libvirt/images
  backend: nvme

libvirt:
  uri: qemu:///system
  disk_cache: none
  disk_io: native

ansible:
  path: null
  inventory: deployer/inventory.local

# Students import Harvester into Rancher in Exercise 1 (The Arrival),
# same as suse-virt-workshop and suse-virt-rodeo.
harvester_auto_import: false

credentials:
  harvester_os_password: "??harvester_os_password"
  harvester_admin_password: "??harvester_admin_password"
  rancher_admin_password: "??rancher_admin_password"
  harvester_token: "??harvester_token"
