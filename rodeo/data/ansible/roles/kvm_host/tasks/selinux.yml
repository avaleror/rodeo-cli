---
# Lab workshops run permissive. Skip entirely when SELinux is not mounted
# (fail closed when it is present but the module cannot set the mode).
- name: Check whether SELinux is available on this host
  ansible.builtin.stat:
    path: /sys/fs/selinux
  register: _selinux_fs

- name: Set SELinux to permissive
  ansible.posix.selinux:
    policy: targeted
    state: permissive
  when:
    - _selinux_fs.stat.exists | default(false)
    - (selinux_mode | default('permissive')) == 'permissive'
