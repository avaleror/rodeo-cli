name: release-please

# Automated releases. On every push to main, release-please parses the
# Conventional Commit history and maintains a "release PR" that bumps the
# version (in pyproject.toml + the doc badges) and updates CHANGELOG.md.
# Merging that PR creates the git tag and the GitHub Release automatically.
# You never pick a version number or write release notes by hand.

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # A new release is not the validated one until a live deploy passed and a
      # PR moved STABLE to it (docs/releasing.md). GitHub marks every new
      # release "Latest"; put the badge back on the release install.sh installs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Keep "Latest" on the STABLE release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$(tr -d '[:space:]' < STABLE)"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --latest
          else
            echo "::warning::STABLE names $tag, which has no GitHub release"
          fi
