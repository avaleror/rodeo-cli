---
- name: Add VM hostnames to /etc/hosts
  ansible.builtin.blockinfile:
    path: /etc/hosts
    marker: "# {mark} RODEO LAB VMs"
    block: |
      {% for node in vm_nodes %}
      {{ node.ip }}  {{ node.hostname }}.{{ lab_dns_domain }}  {{ node.name }}
      {% endfor %}
  when: vm_nodes is defined and vm_nodes | length > 0
