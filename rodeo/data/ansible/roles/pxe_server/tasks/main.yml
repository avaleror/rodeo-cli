---
# Load the vms role defaults so this role has vm_nodes, harvester_version,
# harvester_token, harvester_os_password, libvirt_network_*, etc. without
# duplicating them. playbook_dir == ansible/ when run from that playbook.
- name: Load vms defaults (shared lab configuration)
  ansible.builtin.include_vars:
    file: "{{ playbook_dir }}/roles/vms/defaults/main.yml"

# Same SSH key owner as vms (common/ensure_ssh_key). Safe when vms already ran;
# also covers standalone --tags pxe_server.
- name: Ensure host SSH key for guest access
  ansible.builtin.include_role:
    name: common
    tasks_from: ensure_ssh_key

- name: Include package tasks
  ansible.builtin.import_tasks: packages.yml

- name: Include HTTP (nginx) tasks
  ansible.builtin.import_tasks: http.yml

- name: Include TFTP tasks
  ansible.builtin.import_tasks: tftp.yml

- name: Include PXE artifact file tasks
  ansible.builtin.import_tasks: files.yml

- name: Include iPXE / boot script tasks
  ansible.builtin.import_tasks: scripts.yml

- name: Include PXE network tasks
  ansible.builtin.import_tasks: network.yml

- name: Include PXE firewall tasks
  ansible.builtin.import_tasks: firewall.yml

- name: Flush handlers
  ansible.builtin.meta: flush_handlers
