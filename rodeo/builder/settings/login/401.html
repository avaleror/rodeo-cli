<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in — rodeo-cli</title>
  <style>
    :root { color-scheme: dark light; --bg: #0a0a0f; --ink: #e8e4d9; --muted: #8a8a96; --accent: #00ff9d; --onaccent: #0a0a0f; --line: #1e1e2e; }
    @media (prefers-color-scheme: light) {
      :root { --bg: #f5f4ef; --ink: #0a0a0f; --muted: #5c5c68; --accent: #00a566; --onaccent: #ffffff; --line: #dcdad0; }
    }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink);
      font: 15px/1.5 "Helvetica Neue", Arial, sans-serif; }
    main { max-width: 440px; padding: 24px 16px; }
    h1 { margin: 0 0 8px; font-size: 22px; }
    p { color: var(--muted); }
    code { font-family: ui-monospace, Menlo, monospace; font-size: 13px; }
    .actions { display: flex; gap: 8px; margin-top: 18px; }
    a { padding: 8px 14px; border: 1px solid var(--line); border-radius: 2px; color: var(--ink); text-decoration: none;
      font: 700 12px ui-monospace, Menlo, monospace; letter-spacing: .08em; text-transform: uppercase; }
    a.primary { background: var(--accent); border-color: var(--accent); color: var(--onaccent); }
  </style>
</head>
<body>
  <main>
    <h1>You are not logged in</h1>
    <p>The rodeo-cli Settings page manages the credentials stored on this host, so it needs a login.</p>
    <p>Users are listed in <code>/etc/rodeo-builder/htpasswd</code>; ask an administrator of this host for one.</p>
    <div class="actions">
      <a class="primary" href="/rodeo-builder/settings/">Log in</a>
      <a href="javascript:window.close()">Close</a>
    </div>
  </main>
</body>
</html>
