site_name: rodeo-cli
site_description: A declarative CLI that deploys hands-on lab infrastructure (Harvester HCI, Rancher Prime, SUSE Edge) on KVM.
site_url: https://avaleror.github.io/rodeo-cli/
repo_url: https://github.com/avaleror/rodeo-cli
repo_name: avaleror/rodeo-cli
edit_uri: edit/main/docs/

theme:
  name: material
  custom_dir: overrides
  logo: assets/logo/horseshoe-mark.svg
  favicon: assets/logo/favicon.ico
  palette:
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  font: false
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - content.code.copy
    - content.code.annotate
    - toc.follow
    - search.suggest
    - search.highlight

extra_css:
  - stylesheets/custom.css

plugins:
  - search
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: zh-TW
          name: 繁體中文
          build: true
          site_name: rodeo-cli
          nav_translations:
            Home: 首頁
            Get started: 開始使用
            Install on Linux and macOS: 在 Linux 與 macOS 上安裝
            Profiles: Profile 指南
            Create your own rodeo: 建立自己的 rodeo
            Fleet (multi-host workshops): Fleet（多主機 workshop）
            MCP server (agents): MCP server（AI agent）
            Reference: 參考
            Examples: 範例
            Bare metal: 裸機
            AWS from a Mac: 從 Mac 部署到 AWS
            Instruqt track: Instruqt track
            Workshop fleet inventory: Workshop fleet 清單
            Testing & CI: 測試與 CI
            Troubleshooting: 故障排除
            For contributors: 給貢獻者
            Plain KVM hosts: 一般 KVM 主機

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Get started: get-started.md
  - Install on Linux and macOS: install.md
  - Profiles:
    - SUSE Virtualization (Harvester): guide-harvester.md
    - Rancher Prime: guide-rancher.md
    - SUSE Edge: guide-suse-edge.md
    - Plain KVM hosts: guide-kvm-hosts.md
  - Create your own rodeo: custom-rodeos.md
  - Rodeo Builder: rodeo-builder.md
  - Fleet (multi-host workshops): fleet.md
  - MCP server (agents): mcp.md
  - Reference:
    - rodeo-plan.yaml: reference/plan.md
    - definition.yaml: reference/definition.md
  - Examples:
    - Bare metal: examples/bare-metal.md
    - AWS from a Mac: examples/aws-macos.md
    - Instruqt track: examples/instruqt.md
    - Workshop fleet inventory: examples/workshop.md
    - Testing & CI: examples/testing.md
  - Troubleshooting: runbook.md
  - For contributors:
    - Architecture: architecture.md
    - Releasing and validation: releasing.md
    - Claim portal (design): claim-portal.md
    - Claim portal (implementation plan): claim-portal-plan.md
