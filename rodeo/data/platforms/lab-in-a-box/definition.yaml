# definition.yaml — lab-in-a-box platform (rodeo prepares the host, lab-in-a-box
# builds the VMs and runs its addons).
#
# The smallest possible lab: one openSUSE Leap 16 VM, no addons. Real labs
# (e.g. the smlm-workshop profile) ship their own definition.yaml next to their
# rodeo-plan.yaml; the base image, per-node lab-in-a-box knobs and addon
# sections live under lab_in_a_box: in the plan.

apiVersion: 1.0
definition:
  name: lab-in-a-box
  description: "One VM built by lab-in-a-box (smoke test for the platform)"

  start_order:
    - vm1
  harvester_node_names: []
  harvester_ready_count: 0

  network:
    name: default
    bridge: virbr0
    mode: nat
    cidr: 192.168.122.0/24
    gateway: 192.168.122.1
    domain: rodeo.lab

  node_templates:
    vm:
      flavor: vm
      ssh_user: root
      interfaces:
        - role: mgmt
          model: virtio
          ip_family: static

  exposed_services: []

  storage:
    device: ""
    mount_point: /var/lib/libvirt/images
    libvirt_pool_name: default
    libvirt_pool_path: /var/lib/libvirt/images
    image_dir: /var/lib/libvirt/images

  components:
    - name: host-network-prep
      description: "libvirt network, firewalld DNAT, sysctls for the nested KVM lab"
      on_host: true

  host_prep:
    sysctls:
      - net.bridge.bridge-nf-call-iptables=0
      - net.bridge.bridge-nf-call-ip6tables=0
    selinux_mode: permissive
    libvirt:
      ovmf_code: /usr/share/qemu/ovmf-x86_64-4m-code.bin
      ovmf_vars_template: /usr/share/qemu/ovmf-x86_64-4m-vars.bin
      use_modular_daemons: true
    network:
      unmanaged_interfaces:
        - virbr0
      rp_filter_loose: false

  nodes:
    - name: vm1
      template: vm
      hostname: vm1
      ip: "192.168.122.21"
      ssh_user: root
      interfaces:
        - role: mgmt
          mac: "02:00:00:4C:AB:21"
      mgmt_mac: "02:00:00:4C:AB:21"
