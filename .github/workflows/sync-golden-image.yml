name: Keep golden-image branch synced with main

# Merges main into the long-lived feat/golden-image branch whenever main moves,
# so it stays ready to merge. Uses merge (not rebase) because the branch is
# squash-merged into main, so a linear history buys nothing, and merge avoids
# force-push: a plain `git pull` on a local checkout always works. On a merge
# conflict it stops and opens an issue instead of leaving the branch broken.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: sync-golden-image
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check golden-image branch exists
        id: exists
        run: |
          if git ls-remote --exit-code --heads \
               "https://github.com/${{ github.repository }}.git" feat/golden-image >/dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "feat/golden-image not found — nothing to sync."
          fi

      - name: Checkout feat/golden-image
        if: steps.exists.outputs.found == 'true'
        uses: actions/checkout@v4
        with:
          ref: feat/golden-image
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git identity
        if: steps.exists.outputs.found == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Merge main
        if: steps.exists.outputs.found == 'true'
        id: merge
        run: |
          git fetch origin main
          if git merge --no-edit origin/main; then
            echo "conflict=false" >> "$GITHUB_OUTPUT"
          else
            git merge --abort || true
            echo "conflict=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Push synced branch
        if: steps.exists.outputs.found == 'true' && steps.merge.outputs.conflict == 'false'
        run: git push origin feat/golden-image

      - name: Open issue on conflict
        if: steps.exists.outputs.found == 'true' && steps.merge.outputs.conflict == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "golden-image branch needs a manual merge from main" \
            --body "Auto-merge of \`main\` into \`feat/golden-image\` hit conflicts after ${{ github.sha }}. Resolve locally:

          \`\`\`
          git fetch origin
          git checkout feat/golden-image
          git merge origin/main   # resolve conflicts
          git push
          \`\`\`" \
            || echo "issue create failed (non-fatal)"
