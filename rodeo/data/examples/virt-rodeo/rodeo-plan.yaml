# rodeo-plan.yaml for the virt-rodeo profile: the SUSE Virtualization Rodeo
# (suse-virt-rodeo track) on our own cloud hosts instead of Instruqt, with a
# per-lab player in front of it (rodeo/player/).
#
# Same infra and custom/scripts/ as virt-workshop (image cache, NFS backup
# target, student kit, pre-created webserver-prod VM), with two differences:
#   - no checks/: the track's own check-kvm-host scripts are the checks;
#   - 60-nfs-backup-target.sh exports a dedicated loop filesystem mounted
#     nosuid,nodev,noexec, so root in a privileged pod on a Harvester node
#     cannot plant a setuid binary the host's `student` user can run.
#
# virt-workshop stays untouched for the self-serve suse-virt-workshop guide.
#
# Region and subnet are optional: rodeo uses your AWS config region and a
# public subnet of its default VPC. Then: rodeo up --target aws

name: virt-rodeo-lab
deployment_target: aws

provider:
  type: aws
  # region: eu-central-1        # default: your AWS config region
  # subnet_id: subnet-0123abcd  # default: a public subnet of the default VPC;
  #                             # yours must route to an internet gateway
  instance_tier: recommended    # recommended | performance (no budget tier for this profile; see instance_catalog.py)
  # instance_type: m8id.8xlarge   # or pin explicitly instead of a tier
  associate_public_ip: true
  # security_group_ids: [sg-...] # omit to let rodeo create/manage one,
  #                               # scoped to this machine's public IP

network:
  mode: nat
  vip: "192.168.122.10"
  rancher_ip: "192.168.122.9"
  gateway: "192.168.122.1"
  dns_domain: "vertextrust.bank"   # matches the Vertex Trust Bank story, same as suse-virt-workshop

resources:
  harvester:
    memory_mib: 24576    # 24 GiB per Harvester node — same AWS headroom as harvester on m8id.8xlarge.
                         # 3x24 + 16 (Rancher) = 88 GiB guest RAM total, leaving
                         # ~35 GiB of m8id.8xlarge's ~123 GiB usable RAM for the
                         # host + buff/cache.
    vcpu: 10
    disk_gb: 500         # matches the AWS host-context floor: 3 nodes x 500 GB +
                         # 60 GB (Rancher) = 1560 GB, comfortable margin under
                         # m8id.8xlarge's single ~1.9 TiB NVMe device. Leaves
                         # room for the ~308 MiB cached VM image and webserver-prod's
                         # own 5 GiB disk (both created by custom/scripts/) too.
  rancher:
    memory_mib: 16384    # 16 GiB — same AWS headroom as harvester on m8id.8xlarge.
    vcpu: 4
    disk_gb: 60

versions:
  harvester: "1.8.2"
  rancher: "2.14.5"
  k3s: "v1.35.3+k3s1"
  cert_manager: "v1.20.1"

storage:
  image_dir: /var/lib/libvirt/images
  backend: nvme

libvirt:
  uri: qemu:///system
  disk_cache: none
  disk_io: native

ansible:
  path: null
  inventory: deployer/inventory.local

# Students import Harvester into Rancher in Exercise 1 (The Arrival),
# same as suse-virt-workshop and suse-virt-rodeo.
harvester_auto_import: false

credentials:
  harvester_os_password: "??harvester_os_password"
  harvester_admin_password: "??harvester_admin_password"
  rancher_admin_password: "??rancher_admin_password"
  harvester_token: "??harvester_token"
