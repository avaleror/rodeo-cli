---
- name: Create NFS export directory
  ansible.builtin.file:
    path: /srv/nfs/lab
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Configure NFS export for lab VM subnet
  ansible.builtin.copy:
    dest: /etc/exports.d/rodeo-lab.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      /srv/nfs/lab {{ libvirt_network_cidr }}(rw,sync,no_subtree_check,root_squash)
  notify: reload nfs exports

# Older releases created a host login with a password committed in git.
# Drop it on the next kvm_host run. NFS here is IP-restricted, not user auth.
- name: Remove legacy backups login
  ansible.builtin.user:
    name: backups
    state: absent

- name: Enable and start NFS server
  ansible.builtin.systemd:
    name: nfs-server
    enabled: true
    state: started
