name: release-please

# Automated releases. On every push to main, release-please parses the
# Conventional Commit history and maintains a "release PR" that bumps the
# version (in pyproject.toml + the doc badges) and updates CHANGELOG.md.
# Merging that PR creates the git tag and the GitHub Release automatically.
# You never pick a version number or write release notes by hand.

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
