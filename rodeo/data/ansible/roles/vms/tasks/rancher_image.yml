---
# Rancher VM disk + cloud-init seed. Included from images.yml only when the
# topology actually has a Rancher node (see the guarded include there), so
# Rancher-less labs like the 2-node 'test' profile skip all of this.

# The Cloud variant of the Leap 16 image ships with cloud-init pre-installed.
# This avoids the virt-customize --install step which requires network access
# from inside libguestfs (not reliable across all host configurations).
- name: Download openSUSE Leap 16 Cloud image (cloud-init pre-installed)
  ansible.builtin.include_role:
    name: common
    tasks_from: curl_fetch
  vars:
    curl_fetch_url: "{{ leap16_url }}"
    curl_fetch_dest: "{{ image_dir }}/Leap-16.0-Cloud.qcow2"

# Ensure cloud-init services are enabled and resize the disk.
# Build to a temp file so `creates:` guard is only satisfied on full success.
- name: Build Rancher VM disk (enable cloud-init services)
  ansible.builtin.shell: |
    set -euo pipefail
    tmp='{{ image_dir }}/rancher-vda.qcow2.building'
    rm -f "$tmp"
    qemu-img convert -f qcow2 -O qcow2 -o preallocation=metadata \
      '{{ image_dir }}/Leap-16.0-Cloud.qcow2' "$tmp"
    virt-customize -a "$tmp" \
      --run-command 'systemctl enable cloud-init-local.service cloud-init.service cloud-config.service cloud-final.service'
    mv "$tmp" '{{ image_dir }}/rancher-vda.qcow2'
  args:
    executable: /bin/bash
    creates: "{{ image_dir }}/rancher-vda.qcow2"
  environment:
    LIBGUESTFS_BACKEND: direct

- name: Get Rancher disk virtual size
  ansible.builtin.command: qemu-img info --output=json '{{ image_dir }}/rancher-vda.qcow2'
  register: rancher_disk_info
  changed_when: false

- name: Resize Rancher VM disk to {{ libvirt_flavors.rancher.disk_gb }}G
  ansible.builtin.command: >
    qemu-img resize '{{ image_dir }}/rancher-vda.qcow2' {{ libvirt_flavors.rancher.disk_gb }}G
  when: >
    (rancher_disk_info.stdout | from_json)['virtual-size'] | int
    < (libvirt_flavors.rancher.disk_gb | int * 1073741824)

- name: Create cloud-init staging directory
  ansible.builtin.file:
    path: /tmp/rancher-cloud-init
    state: directory
    mode: '0755'

- name: Write cloud-init meta-data
  ansible.builtin.template:
    src: cloud-init-meta-data.j2
    dest: /tmp/rancher-cloud-init/meta-data

- name: Write cloud-init user-data
  ansible.builtin.template:
    src: cloud-init-user-data.j2
    dest: /tmp/rancher-cloud-init/user-data

- name: Write cloud-init network-config
  ansible.builtin.template:
    src: cloud-init-network-config.j2
    dest: /tmp/rancher-cloud-init/network-config

# No creates: guard — cloud-init ISO is always rebuilt to match current templates
- name: Build Rancher cloud-init seed ISO
  ansible.builtin.command: >
    xorriso -as mkisofs
    -V cidata -J -r
    -o '{{ image_dir }}/rancher-cloud-init.iso'
    /tmp/rancher-cloud-init/meta-data
    /tmp/rancher-cloud-init/user-data
    /tmp/rancher-cloud-init/network-config
