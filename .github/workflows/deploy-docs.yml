name: Deploy docs to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - "rodeo/builder/**"
      - "rodeo/data/examples/**"
      - "rodeo/data/platforms/**"
      - "scripts/build-builder-static.py"
      - ".github/workflows/deploy-docs.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'
          cache: pip

      - run: pip install -r requirements-docs.txt

      # The Rodeo Builder's add-on picker lists the add-ons of lab-in-a-box's
      # latest release (the ref rodeo deploys by default).
      - name: Fetch lab-in-a-box (latest release)
        id: liab
        run: |
          repo=https://github.com/SUSE-Technical-Marketing/lab-in-a-box
          ref=$(git ls-remote --tags --refs "$repo" | sed 's|.*refs/tags/||' \
                | grep -E '^v?[0-9]+(\.[0-9]+)*$' | sort -V | tail -1)
          test -n "$ref"
          git clone -q --depth 1 --branch "$ref" "$repo" "$RUNNER_TEMP/lab-in-a-box"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Build the static Rodeo Builder into docs/builder/
        run: >-
          python3 scripts/build-builder-static.py
          --labinabox "$RUNNER_TEMP/lab-in-a-box"
          --labinabox-version "${{ steps.liab.outputs.ref }}"

      - run: mkdocs gh-deploy --force
