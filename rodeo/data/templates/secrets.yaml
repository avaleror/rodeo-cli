# ~/.rodeo/secrets.yaml — kept out of version control
# chmod 600 ~/.rodeo/secrets.yaml
# `rodeo init` generates this file with a random password.
#
# harvester_os_password    — OS console (rancher user SSH/TTY)
# harvester_admin_password — Harvester web UI admin account
# rancher_admin_password   — Rancher web UI admin account
# harvester_token          — cluster join token (shared by all nodes)

harvester_os_password: "CHANGE_ME"
harvester_admin_password: "CHANGE_ME"
rancher_admin_password: "CHANGE_ME"
harvester_token: "CHANGE_ME"
