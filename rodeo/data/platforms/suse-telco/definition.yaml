# definition.yaml: SUSE Telco Cloud 3.7 topology (Northline workshop).
#
# Built-in suse-telco topology, the same as definition.yaml in the
# suse-telco-workshop repo. A definition.yaml next to a lab's rodeo-plan.yaml
# replaces this one.
#
# Five libvirt guests on libvirt's default NAT network, 192.168.122.0/24
# (virbr0), the same network every other profile uses.
#
#   mgmt       management cluster, image cache, Ironic, Gitea
#   site-co    \
#   site-co-2   > the three hosts of site-co-01 (central office, lab 04).
#   site-co-3  /  API on the MetalLB address 192.168.122.20. KubeVirt in lab 07.
#   site-ran   the one host of site-ran-01 (far edge, lab 05). No KubeVirt.
#
# Every guest gets CPU mode host-passthrough, so nested virt reaches all
# site-co hosts. rodeo-plan.yaml (telco.sites) says which guests become
# BareMetalHosts and with which labels.
#
# CPU and RAM are starting sizes, not a measured pin. Disk is a placeholder
# until the first image boot.

apiVersion: 1.0
definition:
  name: suse-telco
  description: "SUSE Telco Cloud 3.7: Rancher Prime management cluster, a 3-host central office and a 1-host far-edge site"

  start_order:
    - mgmt

  harvester_node_names: []
  harvester_ready_count: 0

  network:
    name: default
    bridge: virbr0
    mode: nat
    cidr: 192.168.122.0/24
    gateway: 192.168.122.1
    domain: northline.telco
    dhcp_range:
      start: 192.168.122.100
      end: 192.168.122.254

  node_templates:
    mgmt:
      flavor: mgmt
      ssh_user: root
      infra_type: mgmt
      interfaces:
        - role: mgmt
          model: virtio
          ip_family: dhcp

    site:
      flavor: site
      ssh_user: root
      infra_type: site
      interfaces:
        - role: mgmt
          model: virtio
          ip_family: dhcp

  # Rancher on NodePort 30002 with a rodeo-managed cert. The firewall
  # compiler still looks for a node named rancher, so this slice emits
  # no DNAT rule.
  exposed_services:
    - name: rancher
      description: "Rancher Prime NodePort"
      host_port: 30002
      guest_port: 30002
      target: mgmt
      proto: tcp

  storage:
    device: ""
    mount_point: /var/lib/libvirt/images
    fs_type: xfs
    libvirt_pool_name: default
    libvirt_pool_path: /var/lib/libvirt/images
    image_dir: /var/lib/libvirt/images

  components:
    - name: mgmt
      description: "Management cluster VM (SL Micro, RKE2, Rancher Prime, Metal3, Turtles)"
      nodes: ["mgmt"]
    - name: downstream-hosts
      description: "site-co, site-co-2, site-co-3 and site-ran, enrolled as BareMetalHosts"
      nodes: ["site-co", "site-co-2", "site-co-3", "site-ran"]

  # Versions live in rodeo/profiles/suse_telco.py (3.7.0 release notes).

  host_prep:
    sysctls:
      - net.bridge.bridge-nf-call-iptables=0
      - net.bridge.bridge-nf-call-ip6tables=0
    selinux_mode: permissive
    libvirt:
      ovmf_code: /usr/share/qemu/ovmf-x86_64-4m-code.bin
      ovmf_vars_template: /usr/share/qemu/ovmf-x86_64-4m-vars.bin
      use_modular_daemons: true
    network:
      unmanaged_interfaces:
        - virbr0
      rp_filter_loose: false

  # MAC prefix 0F, distinct from suse-virt (0D) and suse-edge (0E).
  nodes:
    - name: mgmt
      template: mgmt
      index: 0
      hostname: mgmt
      uuid: "a1000001-0f00-4000-8000-000000000010"
      ip: "192.168.122.10"
      config_iso_name: ""
      ssh_user: root
      interfaces:
        - role: mgmt
          mac: "02:00:00:0F:62:10"
      mgmt_mac: "02:00:00:0F:62:10"

    - name: site-co
      template: site
      index: 1
      hostname: site-co
      uuid: "a1000002-0f00-4000-8000-000000000021"
      ip: "192.168.122.21"
      config_iso_name: ""
      ssh_user: root
      interfaces:
        - role: mgmt
          mac: "02:00:00:0F:62:21"
      mgmt_mac: "02:00:00:0F:62:21"

    # site-ran-01 comes from the ClusterClass, whose MetalLB pool announces the
    # control-plane endpoint 192.168.122.22/32. The host itself takes .32 so the
    # VIP never equals the node address.
    - name: site-ran
      template: site
      index: 2
      hostname: site-ran
      uuid: "a1000003-0f00-4000-8000-000000000032"
      ip: "192.168.122.32"
      config_iso_name: ""
      ssh_user: root
      interfaces:
        - role: mgmt
          mac: "02:00:00:0F:62:32"
      mgmt_mac: "02:00:00:0F:62:32"

    # site-co-2 and site-co-3 join site-co in site-co-01. .22 is site-ran-01's
    # VIP and .20 is site-co-01's, so the hosts take .23 and .24.
    - name: site-co-2
      template: site
      index: 3
      hostname: site-co-2
      uuid: "a1000004-0f00-4000-8000-000000000023"
      ip: "192.168.122.23"
      config_iso_name: ""
      ssh_user: root
      interfaces:
        - role: mgmt
          mac: "02:00:00:0F:62:23"
      mgmt_mac: "02:00:00:0F:62:23"

    - name: site-co-3
      template: site
      index: 4
      hostname: site-co-3
      uuid: "a1000005-0f00-4000-8000-000000000024"
      ip: "192.168.122.24"
      config_iso_name: ""
      ssh_user: root
      interfaces:
        - role: mgmt
          mac: "02:00:00:0F:62:24"
      mgmt_mac: "02:00:00:0F:62:24"
