# rodeo-cli Settings page: Apache configuration, installed by install.sh next to this
# file as /etc/apache2/conf.d/rodeo-builder.conf (/etc/httpd/conf.d/ on RHEL family).
# Server scope, so every vhost (plain HTTP and TLS) gets it.
#
#   /rodeo-builder/settings/  the page (static files)
#   /rodeo-builder/admin      its JSON API (CGI script, runs as the Apache user)
#   /rodeo-login/401.html     shown when a login is cancelled or fails
#
# Everything under /rodeo-builder/ is served over HTTPS only (plain HTTP is redirected)
# and needs a user from /etc/rodeo-builder/htpasswd. Needs mod_cgid (or mod_cgi),
# mod_alias, mod_auth_basic, mod_authn_file and mod_authz_user.

Define RODEO_BUILDER_ROOT /srv/www/rodeo-builder

ScriptAlias /rodeo-builder/admin ${RODEO_BUILDER_ROOT}/cgi-bin/settings.py
Alias /rodeo-builder/settings ${RODEO_BUILDER_ROOT}/htdocs
Alias /rodeo-login ${RODEO_BUILDER_ROOT}/login

<Location "/rodeo-builder/">
    <If "%{HTTPS} != 'on'">
        Redirect "https://%{HTTP_HOST}%{REQUEST_URI}"
    </If>
    <Else>
        AuthType Basic
        AuthName "rodeo-cli Settings"
        AuthBasicProvider file
        AuthUserFile /etc/rodeo-builder/htpasswd
        Require valid-user
    </Else>
    ErrorDocument 401 /rodeo-login/401.html
</Location>

<Directory ${RODEO_BUILDER_ROOT}/cgi-bin>
    Require all granted
    Options +ExecCGI
    SetHandler cgi-script
</Directory>

<Directory ${RODEO_BUILDER_ROOT}/htdocs>
    Require all granted
    Options -Indexes
    DirectoryIndex index.html
    <IfModule mod_expires.c>
        ExpiresActive On
        ExpiresDefault "access plus 0 seconds"
    </IfModule>
</Directory>

<Directory ${RODEO_BUILDER_ROOT}/login>
    Require all granted
    Options -Indexes
</Directory>
