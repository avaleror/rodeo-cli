name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check rodeo tests
      - name: Audit dependencies
        if: matrix.python-version == '3.12'
        run: |
          python - << 'PY'
          import tomllib
          from pathlib import Path
          data = tomllib.loads(Path("pyproject.toml").read_text())
          extras = data["project"].get("optional-dependencies", {})
          reqs = list(data["project"]["dependencies"])
          for group in extras.values():
              reqs.extend(group)
          Path("/tmp/rodeo-reqs.txt").write_text("\n".join(reqs) + "\n")
          PY
          pip-audit -r /tmp/rodeo-reqs.txt
      - name: Test
        run: pytest tests/ -v

  ansible-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install ansible-lint
        run: pip install "ansible-lint>=25.0" "ansible-core>=2.16,<2.19"
      - name: Install collections
        run: ansible-galaxy collection install -r rodeo/data/ansible/requirements.yml
      - name: Lint Ansible roles
        run: ansible-lint rodeo/data/ansible
