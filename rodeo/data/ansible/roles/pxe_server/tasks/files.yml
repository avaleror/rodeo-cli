---
# The vms role already downloads the ISO (used by ISO boot). The PXE install
# still needs the ISO accessible over HTTP so the Harvester installer can
# fetch it during installation (iso_url in the config YAML). A symlink avoids
# a second 1+ GB download.
#
# vmlinuz, initrd, and rootfs.squashfs are NOT downloaded by the vms role
# (it boots from ISO directly). They are only needed for PXE boot and are
# fetched here.

- name: Symlink Harvester ISO into PXE HTTP root
  ansible.builtin.file:
    src: "{{ image_dir }}/harvester-v{{ harvester_version }}-amd64.iso"
    dest: "{{ pxe_http_root }}/harvester/harvester-v{{ harvester_version }}-amd64.iso"
    state: link
    force: true

- name: Download Harvester {{ harvester_version }} PXE boot artifacts
  ansible.builtin.shell: |
    set -euo pipefail
    dest='{{ pxe_http_root }}/harvester/{{ item }}'
    tmp="$dest.downloading"
    curl -4 --http1.1 -fsSL --retry 5 --retry-delay 10 --retry-all-errors \
      -C - -o "$tmp" '{{ pxe_harvester_base_url }}/{{ item }}'
    mv "$tmp" "$dest"
    chmod 0644 "$dest"
  args:
    executable: /bin/bash
    creates: "{{ pxe_http_root }}/harvester/{{ item }}"
  loop:
    - "harvester-v{{ harvester_version }}-vmlinuz-amd64"
    - "harvester-v{{ harvester_version }}-initrd-amd64"
    # rootfs.squashfs (~1.5 GB) last in the loop — largest PXE artifact.
    - "harvester-v{{ harvester_version }}-rootfs-amd64.squashfs"
