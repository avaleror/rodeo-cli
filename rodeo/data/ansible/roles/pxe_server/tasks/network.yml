---
# Redefine the libvirt default network with dnsmasq PXE extensions.
# The extensions live in the dnsmasq namespace (xmlns:dnsmasq) of the network
# XML and are written to libvirt's generated dnsmasq.conf at network start.
#
# Two-stage iPXE boot over the existing virbr0 NAT network:
#   Stage 1 — UEFI firmware sends a DHCP request (no iPXE user-class).
#             dnsmasq replies with boot file "ipxe.efi" (TFTP).
#   Stage 2 — iPXE loads, sends a new DHCP request with user-class "iPXE".
#             dnsmasq replies with the per-node HTTP URL for that MAC.
#             iPXE fetches the script, loads kernel + initrd, and starts
#             the Harvester unattended installer.
#
# The network must be destroyed and re-defined; libvirt does not allow live
# edits to the dnsmasq options namespace. The same guard as vms/network_setup.yml
# prevents destruction while VMs are running.

# Idempotency: redefine when PXE dnsmasq options are missing OR any planned
# DHCP host (mac+name+ip) drifted — keeps node add/renumber from sticking on
# a stale virbr0 definition after vms already added hosts without PXE opts.
- name: Dump current network XML
  ansible.builtin.command: virsh net-dumpxml {{ libvirt_network_name }}
  register: _current_net_xml
  changed_when: false
  failed_when: false

- name: Compute whether PXE network XML matches plan
  ansible.builtin.set_fact:
    _pxe_net_needs_redefine: >-
      {%- set xml = _current_net_xml.stdout | default('') -%}
      {%- set ns = namespace(need=('dnsmasq:options' not in xml)) -%}
      {%- for node in vm_nodes -%}
      {%- set frag = "mac='" ~ node.mgmt_mac ~ "' name='" ~ node.name ~ "' ip='" ~ node.ip ~ "'" -%}
      {%- if frag not in xml -%}
      {%- set ns.need = true -%}
      {%- endif -%}
      {%- endfor -%}
      {{ ns.need }}

- name: Redefine network with PXE options (skipped if plan matches)
  when: _pxe_net_needs_redefine | bool
  block:
    - name: Check for running domains before network redefinition
      ansible.builtin.command: virsh list --name --state-running
      register: _pxe_running_domains
      changed_when: false

    - name: Fail if virsh list failed or any domain is running
      ansible.builtin.fail:
        msg: >-
          {% if _pxe_running_domains.rc != 0 -%}
          Cannot redefine the default network with PXE options — virsh list failed
          (rc={{ _pxe_running_domains.rc }}). Fix libvirt before re-running.
          {%- else -%}
          Cannot redefine the default network with PXE options — domains are running:
          {{ _pxe_running_domains.stdout_lines }}.
          Stop all VMs first: virsh destroy harvester1 harvester2 harvester3 rancher
          {%- endif %}
      when: _pxe_running_domains.rc != 0 or (_pxe_running_domains.stdout | trim != '')

    - name: Destroy default network to allow redefinition
      community.libvirt.virt_net:
        name: "{{ libvirt_network_name }}"
        state: absent
      failed_when: false

    - name: Define default network with PXE dnsmasq options
      community.libvirt.virt_net:
        command: define
        name: "{{ libvirt_network_name }}"
        xml: "{{ lookup('template', 'network-pxe.xml.j2') }}"

    # autostart intentionally false — same reasoning as vms/network_setup.yml:
    # rodeo.sh phase 3 re-enables autostart before starting VMs.
    - name: Start default network (autostart disabled until phase 3)
      community.libvirt.virt_net:
        name: "{{ libvirt_network_name }}"
        state: active
        autostart: false
