# What the student UI (rodeo player) shows for this lab (see rodeo/player/profile.py).
# No track: the exercises live on the workshop guide, opened from the player.
title: SUSE Telco Cloud Workshop
track_repo: https://github.com/SUSE-Technical-Marketing/suse-telco-rodeo.git
guide_url: https://avaleror.github.io/suse-telco-workshop/
# The guide runs virsh on the host and logs in to mgmt as root. libvirt access
# is root-equivalent on the host, so fleets need per_host_ssh_key.
student_libvirt: true
student_vm_access: [192.168.122.10]
uis:
  - key: rancher
    label: SUSE Rancher Prime
    upstream: 192.168.122.10:30002
    tab_port: 30002
  # Gitea on mgmt mirrors the site console repo that Fleet deploys.
  - key: gitea
    label: Gitea
    upstream: 192.168.122.10:3000
    scheme: http
    tab_port: 3000
  # The site consoles answer only after lab 06, so the lobby does not wait for them.
  # tab_port only names the tab here (no track): each one must be unique.
  - key: console
    label: Site console (site-co-01)
    upstream: 192.168.122.21:30080
    scheme: http
    tab_port: 30080
    lobby: false
  - key: ranconsole
    label: Site console (site-ran-01)
    upstream: 192.168.122.32:30080
    scheme: http
    tab_port: 30081
    lobby: false
credentials:
  - label: SUSE Rancher Prime
    user: admin
    password: ??rancher_admin_password
  - label: mgmt VM (console)
    user: root
    password: ??mgmt_root_password
variables:                       # track variable: ??secrets.yaml key
  RANCHER_PASSWORD: ??rancher_admin_password
