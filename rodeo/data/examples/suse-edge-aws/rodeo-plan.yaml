# rodeo-plan.yaml — SUSE Edge 3.6, pre-tuned for AWS.
#
# Same topology as the bare-metal "suse-edge" profile — Rancher Prime + EIB +
# 4 edge nodes (vTPM) — with more RAM/disk headroom (AWS instances afford it)
# and rancher_tls forced to "secret" (self-signed, NodePort 30002) instead of
# the bare-metal default's letsEncrypt: no external DNS/ACME dependency, same
# choice already made for virt-workshop-aws's Harvester/Rancher UIs.
#
# What this deploys:
#   - 1 Rancher Prime 2.14.1 VM (K3s + Elemental Operator + Fleet)
#   - 1 Edge Image Builder 1.3.3.1 VM (openSUSE Leap Micro 6.2)
#   - 4 edge node VMs (blank disk + virtual TPM 2.0, started as a lab exercise)
#
# Fill in provider.region and provider.subnet_id, then: rodeo up --target aws

name: suse-edge-aws-rodeo
type: suse-edge

deployment_target: aws

provider:
  type: aws
  region: eu-central-1          # <- set to your region
  subnet_id: subnet-CHANGE-ME   # <- must be in a VPC with an internet gateway
  instance_tier: recommended    # budget | recommended | performance
  # instance_type: m8id.4xlarge   # or pin explicitly instead of a tier
  associate_public_ip: true
  # security_group_ids: [sg-...] # omit to let rodeo create/manage one,
  #                               # scoped to this machine's public IP

network:
  mode: nat
  rancher_ip: "192.168.122.9"
  gateway: "192.168.122.1"
  dns_domain: "vertextrust.bank"

resources:
  rancher:
    memory_mib: 12288   # 12 GiB (was 8 on bare metal) — more headroom, AWS affords it
    vcpu: 4
    disk_gb: 60
  eib:
    memory_mib: 16384   # 16 GiB (was 12) — EIB builds go faster with more RAM
    vcpu: 4
    disk_gb: 150        # 150 GB (was 100) — Hauler artifacts + built images add up
  edge-node:
    memory_mib: 4096    # unchanged — lightweight simulated appliances, no real workload
    vcpu: 2
    disk_gb: 25         # 25 GB (was 20) — small margin

# Guest total: 12+16+4x4 = 44 GiB RAM, 4+4+4x2 = 16 vCPU, 60+150+4x25 = 310 GB
# disk. Fits m8id.4xlarge (16 vCPU / 64 GiB / 950 GB NVMe) with ~20 GiB RAM
# and ~640 GB disk to spare — same headroom ratio (~0.7 guest/total RAM)
# validated for harvester-aws and virt-workshop-aws-2n.

versions:
  rancher: "2.14.1"
  k3s: "v1.35.5+k3s1"
  cert_manager: "v1.20.1"
  elemental_operator_crds: "1.9.0"
  elemental_operator: "1.9.0"
  elemental_ui_extension: "3.0.1"
  eib: "1.3.3.1"

storage:
  image_dir: /var/lib/libvirt/images
  backend: nvme

libvirt:
  uri: qemu:///system
  disk_cache: none
  disk_io: native

ansible:
  path: null
  inventory: deployer/inventory.local

# Self-signed Rancher cert, NodePort 30002 — no external DNS/ACME dependency.
# The bare-metal "suse-edge" profile defaults to letsEncrypt (designed for
# Instruqt's direct public IP); AWS also has a real public IP so letsEncrypt
# would technically work too, but "secret" keeps this profile dependency-free
# and consistent with virt-workshop-aws's choice.
rancher_tls:
  source: secret

credentials:
  rancher_admin_password: "??rancher_admin_password"
  rancher_vm_password: "??rancher_vm_password"

elemental:
  registrations: 1
