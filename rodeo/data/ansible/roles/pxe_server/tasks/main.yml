---
# Load the vms role defaults so this role has vm_nodes, harvester_version,
# harvester_token, harvester_os_password, libvirt_network_*, etc. without
# duplicating them. playbook_dir == ansible/ when run from that playbook.
- name: Load vms defaults (shared lab configuration)
  ansible.builtin.include_vars:
    file: "{{ playbook_dir }}/roles/vms/defaults/main.yml"

# ssh_public_key is a set_fact from vms/tasks/images.yml. It is available as a
# host fact if this role runs in the same play after vms. Generate and expose it
# here as a fallback so the role also works when run standalone (--tags pxe_server).
- name: Generate the host SSH key if not present
  ansible.builtin.command: ssh-keygen -t ed25519 -f /root/.ssh/id_ed25519 -N ""
  args:
    creates: /root/.ssh/id_ed25519

- name: Read the host SSH public key
  ansible.builtin.slurp:
    src: /root/.ssh/id_ed25519.pub
  register: _pxe_ssh_pubkey_b64

- name: Expose ssh_public_key fact (no-op if vms role already set it)
  ansible.builtin.set_fact:
    ssh_public_key: "{{ _pxe_ssh_pubkey_b64.content | b64decode | trim }}"
  when: ssh_public_key is not defined

- import_tasks: packages.yml
- import_tasks: http.yml
- import_tasks: tftp.yml
- import_tasks: files.yml
- import_tasks: scripts.yml
- import_tasks: network.yml
- import_tasks: firewall.yml
- meta: flush_handlers
