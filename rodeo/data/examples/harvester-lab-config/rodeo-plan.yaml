# Example rodeo-plan.yaml for use with --config-dir ./harvester-lab-config
# This is the *testing variant* for resource-constrained hosts.
# Customize for your test host (baremetal vs instruqt, resources, credentials as ??secrets, etc.)
# When --config-dir is used and this file exists, it is preferred for the plan.

type: suse-virt
name: harvester-rodeo-test
deployment_target: baremetal  # change to instruqt if on Instruqt

network:
  vip: 192.168.122.10

# Example override (plan -P or here)
# This config deploys a 2-node Harvester cluster (no Rancher) using 6 vCPU per node.
# Why: on Ryzen-class hosts, hyperthreading presents 16 logical CPUs to the hypervisor
# (each thread counts as a processor for qemu). 2*6 = 12 leaves headroom for host + qemu overhead.
# RAM/disk are secondary; CPU threads are the real constraint for nested virt.
# Tune further only if needed. The example definition now expects exactly 2 harvester nodes.
resources:
  harvester:
    memory_mib: 16384    # 16 GiB per node for test procedure
    vcpu: 6
    # 250 GB is Harvester's documented minimum and it matters: the elemental
    # install carves the disk into OS + a ~50 GB Longhorn partition + the
    # persistent partition that holds container images. At 100 GB the persistent
    # partition is only ~27 GB, which fills up (Harvester pulls ~19 GB of images)
    # → containerd "no space left on device" → RKE2 never converges → no VIP.
    disk_gb: 250

# Pin the Harvester version explicitly so this profile never silently drifts to
# a different tool default. All Harvester profiles pin the same version.
versions:
  harvester: "1.8.1"

# credentials use ?? for secrets.yaml or env
credentials:
  harvester_os_password: "??harvester_os_password"
  harvester_token: "??harvester_token"

# storage device for multi-disk host (use the larger 2TB disk)
# Confirm with lsblk on your host (e.g. /dev/nvme1n1 for the 2TB).
# This is used by the definition + kvm_host role for the libvirt pool/images.
storage:
  device: "/dev/nvme1n1"   # the 2 TB disk (root is usually nvme0n1 on 1TB)
  mount_point: /var/lib/libvirt/images
  image_dir: /var/lib/libvirt/images

# For full custom definition, edit definition.yaml in this dir (it will be used instead of bundled).
