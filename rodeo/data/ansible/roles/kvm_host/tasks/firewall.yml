---
# On Instruqt, eth0 is configured via cloud-init/Instruqt bootstrap. SLES 16 uses
# NetworkManager (wicked is removed). When firewalld starts and integrates with NM
# via D-Bus, NM reports the zone for each connected interface. If the NM connection
# for eth0 has no zone set (which cloud-init typically does not set), firewalld can
# leave eth0 in an undefined zone state or reassign it in a way that drops the
# Instruqt management connection. We therefore keep firewalld disabled and stopped
# here, during early host prep, before any VM exists.
#
# DeployRunner._start_firewalld() (engine/runner.py) unmasks and starts firewalld
# later, at the top of the cluster phase — well before any Instruqt snapshot, not
# gated behind finalise. On deployment_target: instruqt it also pins the detected
# external interface to the public zone with `--permanent`, which writes the
# interface→zone mapping into firewalld's own persisted config. That's what actually
# closes the race described above: a fresh attendee boot from the snapshot reads the
# pinned zone directly instead of renegotiating it with NetworkManager over D-Bus.
# firewalld being enabled and running in the snapshot is therefore expected and safe.
# On bare-metal deployer runs, deploy.sh starts it explicitly after the Ansible phase.
# firewalld is stopped at the end of packages.yml (before libvirt sockets start)
# to close the window where the kvm_server post-install scripts can start it and
# trigger NM/firewalld zone reassignment on eth0. Repeat the stop here as a
# belt-and-braces measure and mask the socket so nothing socket-activates it
# during the rest of the kvm_host phase.
- name: Ensure firewalld is stopped and masked during kvm_host phase
  ansible.builtin.systemd:
    name: firewalld
    enabled: false
    state: stopped
    masked: true
  failed_when: false

# All remaining tasks use permanent: true + immediate: false so they stage
# the rules into /etc/firewalld without touching the live (non-running) daemon.

# Protect the management connection — explicit SSH even if the public zone default
# ever differs across SLES 16 image variants.
- name: Ensure SSH is allowed in the public zone (protect management connectivity)
  ansible.posix.firewalld:
    zone: public
    service: ssh
    permanent: true
    immediate: false
    state: enabled

- name: Allow Cockpit web console on the public zone (port 9090)
  ansible.posix.firewalld:
    zone: public
    service: cockpit
    permanent: true
    immediate: false
    state: enabled

- name: Allow forwarding in the libvirt zone
  ansible.posix.firewalld:
    zone: libvirt
    forward: true
    permanent: true
    state: enabled
  notify: reload firewalld

# Belt-and-braces for the RKE2 cluster underneath Harvester: explicitly accept
# all traffic within the node subnet in the libvirt zone, so the RKE2 supervisor
# (9345) and apiserver (6443), etcd (2379-2381), kubelet (10250) and the
# Canal/VXLAN + Kube-OVN overlays between nodes are never dropped by the host
# firewall — even if bridge-netfilter gets turned on by something else.
- name: Accept intra-cluster traffic on the node subnet (NAT mode, libvirt zone)
  ansible.posix.firewalld:
    zone: libvirt
    rich_rule: "rule family=ipv4 source address={{ libvirt_network_cidr }} accept"
    permanent: true
    immediate: false
    state: enabled
  when: network_mode == 'nat'
  notify: reload firewalld

# --- NAT mode: expose the UI ports on the host and DNAT them to the guests ---
# firewalld on SLES 16 uses the nftables backend; port_forward drives the DNAT
# natively (no raw iptables, no custom systemd unit).

- name: Expose Harvester UI and Rancher NodePorts on the public zone (NAT mode)
  ansible.posix.firewalld:
    zone: public
    port: "{{ item }}/tcp"
    permanent: true
    immediate: false
    state: enabled
  loop:
    - "{{ harvester_ui_port }}"
    - "{{ rancher_nodeport }}"
  when: network_mode == 'nat'
  notify: reload firewalld

- name: Enable masquerade on the public zone (host egress)
  ansible.posix.firewalld:
    zone: public
    masquerade: true
    permanent: true
    immediate: false
    state: enabled
  when: network_mode == 'nat'
  notify: reload firewalld

# The DNAT'd packets leave the host toward the guests via virbr0, which firewalld
# binds to the libvirt zone. Masquerading there SNATs them to the host's virbr0
# address so the guest replies route back through the host and the forwarded
# connection completes, even if the guest's default route is not the host.
- name: Enable masquerade on the libvirt zone (DNAT return path to guests)
  ansible.posix.firewalld:
    zone: libvirt
    masquerade: true
    permanent: true
    immediate: false
    state: enabled
  when: network_mode == 'nat'
  notify: reload firewalld

# Harvester UI DNAT (host:8443 → VIP:443) is managed dynamically by the
# libvirt qemu hook (/etc/libvirt/hooks/qemu) via nftables — NOT by a static
# firewalld port_forward — because the kube-vip VIP only exists when the
# cluster nodes are running. Adding a static DNAT to a non-existent VIP causes
# connection resets. The hook inserts the rule on first node start and removes
# it when the last node stops. The port is still opened below so the kernel
# accepts ingress traffic regardless; the hook decides where it goes.

- name: Forward Rancher NodePort to the Rancher VM (NAT mode, static)
  ansible.posix.firewalld:
    zone: public
    port_forward:
      - port: "{{ rancher_nodeport }}"
        proto: tcp
        toport: "{{ rancher_nodeport }}"
        toaddr: "{{ rancher_ip }}"
    permanent: true
    immediate: false
    state: enabled
  when: network_mode == 'nat'
  notify: reload firewalld

# libvirt runs its OWN nftables firewall (table ip libvirt_network) whose
# guest_input chain rejects new inbound to guests — which silently kills the
# DNAT'd host port-forwards above (e.g. host:8443 -> Harvester VIP). firewalld
# accepts the DNAT'd packet, but libvirt's table rejects it right after.
# Install a libvirt network hook that inserts `ct status dnat accept` BEFORE
# that reject, re-applied whenever libvirt rebuilds its table on network start.
- name: Ensure /etc/libvirt/hooks directory exists
  ansible.builtin.file:
    path: /etc/libvirt/hooks
    state: directory
    owner: root
    group: root
    mode: '0755'
  when: network_mode == 'nat'

- name: Install libvirt network hook to allow DNAT'd inbound to lab guests
  ansible.builtin.copy:
    dest: /etc/libvirt/hooks/network
    mode: '0755'
    content: |
      #!/bin/sh
      # rodeo: let DNAT'd inbound (host port-forwards) reach lab guests.
      # libvirt rebuilds its nftables table on every network (re)start and adds a
      # reject rule in guest_input. We insert `ct status dnat accept` at chain
      # start (before all other rules) so DNAT'd packets are accepted.
      # Anchoring to the reject handle via `insert handle H` inserts after H on
      # some nftables versions; inserting without a handle is always position 0.
      [ "$1" = "default" ] || exit 0
      case "$2" in started|plugged|updated) ;; *) exit 0 ;; esac

      # Wait for libvirt to set up the guest_input chain (up to 5 s).
      for i in $(seq 1 10); do
        nft list chain ip libvirt_network guest_input 2>/dev/null && break
        sleep 0.5
      done
      nft list chain ip libvirt_network guest_input 2>/dev/null || exit 0

      # Remove any stale ct status dnat accept rules.
      for h in $(nft -a list chain ip libvirt_network guest_input 2>/dev/null \
                 | awk '/ct status dnat accept/{print $NF}'); do
        nft delete rule ip libvirt_network guest_input handle "$h" 2>/dev/null
      done

      # Insert at chain start (position 0, before the reject rule).
      nft insert rule ip libvirt_network guest_input ct status dnat accept 2>/dev/null
      exit 0
  when: network_mode == 'nat'

- name: Apply the DNAT-allow rule to the running libvirt network now (no-op if not up yet)
  ansible.builtin.command: /etc/libvirt/hooks/network default started
  when: network_mode == 'nat'
  changed_when: false
  failed_when: false

# --- Rancher ingress mode (suse-edge + sslip.io + Let's Encrypt) ---
# When rancher_ingress_enabled is true, Rancher is exposed via Traefik ingress on
# ports 80 and 443 instead of the NodePort. Port 80 is required for the Let's
# Encrypt HTTP01 ACME challenge; port 443 is the actual HTTPS endpoint.
- name: Open HTTP + HTTPS on the public zone for Rancher ingress
  ansible.posix.firewalld:
    zone: public
    port: "{{ item }}/tcp"
    permanent: true
    immediate: false
    state: enabled
  loop:
    - "80"
    - "443"
  when: network_mode == 'nat' and rancher_ingress_enabled | default(false)
  notify: reload firewalld

- name: DNAT port 80 to Rancher VM for Let's Encrypt HTTP01 challenge
  ansible.posix.firewalld:
    zone: public
    port_forward:
      - port: "80"
        proto: tcp
        toport: "80"
        toaddr: "{{ rancher_ip }}"
    permanent: true
    immediate: false
    state: enabled
  when: network_mode == 'nat' and rancher_ingress_enabled | default(false)
  notify: reload firewalld

- name: DNAT port 443 to Rancher VM Traefik ingress
  ansible.posix.firewalld:
    zone: public
    port_forward:
      - port: "443"
        proto: tcp
        toport: "443"
        toaddr: "{{ rancher_ip }}"
    permanent: true
    immediate: false
    state: enabled
  when: network_mode == 'nat' and rancher_ingress_enabled | default(false)
  notify: reload firewalld
