name: PR title

# Releases are driven by Conventional Commits. Because PRs are squash-merged,
# the PR title becomes the commit on main that release-please parses — so the
# title must be a valid Conventional Commit (e.g. "feat: ...", "fix(vms): ...").

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Allowed types — keep in sync with changelog-sections in
          # release-please-config.json.
          types: |
            feat
            fix
            perf
            refactor
            docs
            build
            ci
            test
            chore
